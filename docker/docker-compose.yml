services:
  postgres:
    image: postgres:16
    container_name: riskforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: riskforge
      POSTGRES_USER: riskforge
      POSTGRES_PASSWORD: riskforge_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: riskforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: